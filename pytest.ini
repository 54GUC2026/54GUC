[pytest]
testpaths = arch4/tests
markers =
    unit: Small deterministic logic tests.
    contract: Boundary and payload contract tests.
    scenario: Named workflow and subsystem integration tests.
    replay: Recorded evidence and durable-event regression tests.
    portable: Portable Windows app lifecycle and packaging tests.
    hardware: Real-modem or hardware-intent validation.
    soak: Long-running stability or endurance tests.
    legacy: Broad regression coverage not promoted as a release gate.
norecursedirs =
    dist
    build
    installers
    docs
    archive
    ops
    .git
    .venv
    venv
    env
