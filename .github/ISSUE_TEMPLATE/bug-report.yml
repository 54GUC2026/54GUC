name: Bug report
description: Describe a reproducible problem in the current software without private data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Use the router-test form for an unsupported model or firmware.
        For a bug, explain what happened and what you expected. Do not repeat
        an unsafe router action to reproduce it.

        Keep raw support ZIPs, router backups, passwords, activation/session
        codes, device/SIM identifiers and full History out of public issues.
        Review screenshots and short excerpts yourself before attaching them.
        Report sensitive security problems through SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Actual app version or source commit
      description: Include Windows version and whether you used a portable app or source. Do not write only "latest".
    validations:
      required: true
  - type: textarea
    id: router
    attributes:
      label: Model, firmware, profile and mode
      description: Give the exact model/firmware and selected profile. Say Observe only or Live. If this is a simulator, say so. Exclude serial/IMEI/SIM details.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include the visible message and approximate time. Separate a requested router change from its final confirmed or unconfirmed result.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: Explain why, including a guide or known working version if relevant. A missing or unsupported field alone may be a profile limit.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps or a minimal safe example
      description: Describe actions already taken, or a sanitized offline input. Do not force an outage, retry an uncertain command or post complete History to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: limits
    attributes:
      label: Evidence limits and checks already done
      description: Say what was removed for privacy, what is still unknown and whether the issue also appears in a replay or simulator. Do not present those as physical-router proof.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I reviewed this report and its attachments and removed credentials, codes, private identifiers, location and History.
          required: true
